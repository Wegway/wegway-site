name: Sync Substack

# Mirrors wegway.substack.com onto the site: new posts, edits and deletions.
# Runs every 20 minutes, or on demand from the repo's Actions tab
# (Sync Substack -> Run workflow).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4 pillow

      - run: python scripts/sync_substack.py

      - name: Commit and publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A writing_posts_data.js writing_index_data.js writing-thumbs
          if git diff --cached --quiet; then
            echo "Nothing changed on Substack."
            exit 0
          fi
          git config user.name "wegway-substack-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync Substack posts"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with the built-in token don't always start a Pages
          # build by themselves, so ask for one explicitly.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
